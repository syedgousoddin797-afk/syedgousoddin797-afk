<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="sg-title sg-desc">
<title id="sg-title">Syed Gousuddin — Software Engineer | Python Full Stack Developer</title>
<desc id="sg-desc">Burgundy editorial developer banner with fine technical grid, orbital rings, animated line and restrained rose glow.</desc>
<defs>
  <linearGradient id="sg-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10070C"/><stop offset=".58" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient>
  <linearGradient id="sg-rose" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#701A3D" stop-opacity=".05"/><stop offset=".48" stop-color="#C77B9B"/><stop offset="1" stop-color="#E5B5C7" stop-opacity=".05"/></linearGradient>
